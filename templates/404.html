{% extends 'base.html' %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4 animate-fade-in">
    <div class="relative mb-8">
        <div class="text-9xl font-black text-gray-100 absolute -inset-4 select-none pointer-events-none">404</div>
        <div class="relative z-10 text-red-600 text-8xl mb-4">
            <i class="fas fa-search"></i>
        </div>
    </div>
    
    <h1 class="text-4xl font-extrabold text-gray-800 mb-4 bg-gradient-to-r from-red-600 to-pink-600 bg-clip-text text-transparent">
        Oops! Page Not Found
    </h1>
    
    <p class="text-gray-600 max-w-md mx-auto mb-8 text-lg">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    
    <div class="flex flex-col sm:flex-row gap-4">
        <a href="{{ url_for('home') }}" class="bg-gradient-to-r from-red-600 to-pink-600 text-white py-4 px-8 rounded-2xl shadow-xl hover:shadow-2xl transform hover:-translate-y-1 font-bold transition-all duration-300 flex items-center gap-2">
            <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="{{ url_for('contact') }}" class="bg-white text-gray-700 py-4 px-8 rounded-2xl border-2 border-gray-100 shadow-lg hover:shadow-xl transform hover:-translate-y-1 font-bold transition-all duration-300 flex items-center gap-2">
            <i class="fas fa-envelope"></i> Contact Support
        </a>
    </div>
    
    <div class="mt-12 text-gray-400 animate-bounce-slow">
        <i class="fas fa-chevron-down"></i>
    </div>
</div>
{% endblock %}
